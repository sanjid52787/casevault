spring:
  application:
    name: casevault
  datasource:
    url: ${CASEVAULT_DB_URL}
    username: ${CASEVAULT_DB_USERNAME}
    password: ${CASEVAULT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 15m
      cookie:
        http-only: true
        secure: true
        same-site: strict
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
