spring:
  application:
    name: casevault
  datasource:
    url: ${CASEVAULT_DB_URL}
    username: ${CASEVAULT_DB_USERNAME}
    password: ${CASEVAULT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
casevault:
  evidence:
    directory: ${CASEVAULT_EVIDENCE_DIRECTORY:uploads}
    max-bytes: ${CASEVAULT_EVIDENCE_MAX_BYTES:10485760}
    max-files-per-case: ${CASEVAULT_EVIDENCE_MAX_FILES_PER_CASE:20}
  retention:
    enabled: false
    cron: ${CASEVAULT_RETENTION_CRON:0 0 3 * * *}
    retention-days: ${CASEVAULT_RETENTION_DAYS:365}
    grace-days: ${CASEVAULT_RETENTION_GRACE_DAYS:30}
server:
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 15m
      cookie:
        http-only: true
        secure: true
        same-site: strict
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
