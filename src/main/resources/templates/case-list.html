<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cases | CaseVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">✓</span>CaseVault</a><nav class="topnav"><a th:href="@{/}">Dashboard</a><a th:href="@{/password/change}">Password</a></nav></header><main class="page"><div class="toolbar"><div><p class="eyebrow">Case workspace</p><h1>Cases</h1><p class="subtitle">Results are restricted to your authorised scope.</p></div><a class="button" th:href="@{/cases/new}">Create case</a></div><section class="card"><form class="search-form" method="get"><label>Search cases<input name="q" placeholder="Title or description" th:value="${query}"></label><label>From<input type="date" name="from"></label><label>To<input type="date" name="to"></label><button type="submit">Search</button></form><ul class="case-list" th:if="${!cases.empty}"><li th:each="c:${cases.content}"><a th:href="@{/cases/{id}(id=${c.id})}" th:text="${c.title}">case</a></li></ul><p class="empty" th:if="${cases.empty}">No cases match your current scope and search.</p></section></main></body></html>
