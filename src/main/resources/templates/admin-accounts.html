<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><main><form class="logout-form" th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Sign out</button></form><h1>Accounts</h1><table><tr><th>Email</th><th>Status</th><th>Last login</th><th>Failures</th></tr><tr th:each="a:${accounts}"><td th:text="${a.email}">email</td><td th:text="${a.enabled}">status</td><td th:text="${a.lastLoginAt}">login</td><td th:text="${a.failedAttempts}">0</td></tr></table></main></body></html>
