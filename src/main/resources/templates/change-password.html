<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Change password</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1>Change password</h1><form th:action="@{/password/change}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Current password <input name="currentPassword" type="password" required></label><label>New password <input name="newPassword" type="password" minlength="12" maxlength="128" required></label><button type="submit">Change password</button></form></main></body></html>
