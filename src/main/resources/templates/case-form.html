<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create case | CaseVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">✓</span>CaseVault</a><nav class="topnav"><a th:href="@{/cases}">Cases</a></nav></header><main class="page"><p class="eyebrow">New incident</p><h1>Create a case</h1><p class="subtitle">Use synthetic information only.</p><section class="card"><form th:action="@{/cases}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Title<input th:field="*{title}" required></label><label>Description<textarea th:field="*{description}" required></textarea></label><div class="grid two"><label>Category<select th:field="*{category}"><option th:each="c : ${T(uk.ac.ravensbourne.casevault.domain.Category).values()}" th:value="${c}" th:text="${c}"></option></select></label><label>Severity<select th:field="*{severity}"><option th:each="s : ${T(uk.ac.ravensbourne.casevault.domain.Severity).values()}" th:value="${s}" th:text="${s}"></option></select></label></div><button type="submit">Create case</button></form></section></main></body></html>
