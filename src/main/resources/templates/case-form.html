<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Create case</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1>Create incident</h1><form th:action="@{/cases}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Title <input th:field="*{title}" required></label><label>Description <textarea th:field="*{description}" required></textarea></label><label>Category <select th:field="*{category}"><option th:each="c : ${T(uk.ac.ravensbourne.casevault.domain.Category).values()}" th:value="${c}" th:text="${c}"></option></select></label><label>Severity <select th:field="*{severity}"><option th:each="s : ${T(uk.ac.ravensbourne.casevault.domain.Severity).values()}" th:value="${s}" th:text="${s}"></option></select></label><button type="submit">Create</button></form></main></body></html>
