<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create case | CaseVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">✓</span>CaseVault</a><nav class="topnav"><a th:href="@{/cases}">Cases</a></nav></header><main class="page"><p class="eyebrow">New incident</p><h1>Create a case</h1><p class="subtitle">Use synthetic information only.</p><section class="card"><form th:action="@{/cases}" th:object="${caseForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Title<input th:field="*{title}" required aria-describedby="title-error"></label><p id="title-error" class="field-error" th:if="${fieldErrors['title']}" th:text="${fieldErrors['title']}"></p><label>Description<textarea th:field="*{description}" required aria-describedby="description-error"></textarea></label><p id="description-error" class="field-error" th:if="${fieldErrors['description']}" th:text="${fieldErrors['description']}"></p><div class="grid two"><label>Category<select th:field="*{category}"><option value="">Select category</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option></select></label><p class="field-error" th:if="${fieldErrors['category']}" th:text="${fieldErrors['category']}"></p><label>Severity<select th:field="*{severity}"><option value="">Select severity</option><option th:each="s : ${severities}" th:value="${s}" th:text="${s}"></option></select></label><p class="field-error" th:if="${fieldErrors['severity']}" th:text="${fieldErrors['severity']}"></p></div><button type="submit">Create case</button></form></section></main></body></html>
