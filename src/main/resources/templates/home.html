<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | CaseVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">✓</span>CaseVault</a><nav class="topnav"><a th:if="${role != 'AUDITOR_ADMIN'}" th:href="@{/cases}">Cases</a><a th:if="${role == 'AUDITOR_ADMIN'}" th:href="@{/admin/audit}">Audit</a><a th:if="${role == 'AUDITOR_ADMIN'}" th:href="@{/admin/accounts}">Accounts</a><a th:href="@{/password/change}">Password</a><form class="logout-form" th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Sign out</button></form></nav></header>
<main class="page">
    <p class="eyebrow">Secure operations workspace</p>
    <h1>Good to see you.</h1>
    <p class="subtitle">Your current role: <strong th:text="${role}">Role</strong></p>
    <section class="dashboard" th:if="${summary != null}">
        <article class="card">
            <h2 th:text="${summary.primaryLabel}">Your cases</h2>
            <p class="dashboard-count" th:text="${summary.primaryCount}">0</p>
            <a class="button" th:href="@{${summary.primaryHref}}" th:text="${summary.primaryAction}">Open cases</a>
        </article>
        <aside class="metric" th:if="${summary.secondaryLabel != null}">
            <span th:text="${summary.secondaryLabel}">Open cases</span>
            <strong th:text="${summary.secondaryCount == null ? '' : summary.secondaryCount}">0</strong>
            <a th:if="${role == 'AUDITOR_ADMIN'}" th:href="@{/admin/health}">Open system health</a>
        </aside>
    </section>
</main>
</body>
</html>
