<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create User | CaseVault</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-mark">✓</span>CaseVault</a>
    <nav class="topnav">
        <a th:href="@{/admin/audit}">Audit</a>
        <a th:href="@{/admin/accounts}">Accounts</a>
        <a th:href="@{/admin/health}">Health</a>
        <a th:href="@{/password/change}">Password</a>
        <form class="logout-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Sign out</button>
        </form>
    </nav>
</header>

<main class="page">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Auditor / Account Administration</p>
            <h1>Create User Account</h1>
            <p class="subtitle">Create a new user with a generated one-time password.
                The user will be required to change their password on first login.</p>
        </div>
    </div>

    <section class="card">
        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}">Error</p>
        </div>

        <form th:action="@{/admin/accounts/create}" th:object="${request}" method="post" class="form-stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" type="email" th:field="*{email}" required maxlength="254"
                       placeholder="user@example.com" class="form-input">
                <div th:if="${#fields.hasErrors('email')}" class="field-error">
                    <p th:each="err : ${#fields.errors('email')}" th:text="${err}">Validation error</p>
                </div>
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" th:field="*{role}" required class="form-input">
                    <option value="">— Select role —</option>
                    <option th:each="r : ${allowedRoles}" th:value="${r}" th:text="${r}">ROLE</option>
                </select>
                <div th:if="${#fields.hasErrors('role')}" class="field-error">
                    <p th:each="err : ${#fields.errors('role')}" th:text="${err}">Validation error</p>
                </div>
            </div>

            <div class="form-group">
                <label for="organisationId">Organisation</label>
                <select id="organisationId" th:field="*{organisationId}" required class="form-input">
                    <option value="">— Select organisation —</option>
                    <option th:each="o : ${organisations}" th:value="${o.id}" th:text="${o.name}">Org</option>
                </select>
                <div th:if="${#fields.hasErrors('organisationId')}" class="field-error">
                    <p th:each="err : ${#fields.errors('organisationId')}" th:text="${err}">Validation error</p>
                </div>
            </div>

            <div class="form-group">
                <label for="displayName">Display name (optional)</label>
                <input id="displayName" type="text" th:field="*{displayName}" maxlength="160"
                       placeholder="Jane Doe" class="form-input">
            </div>

            <div class="form-actions">
                <button type="submit" class="button primary">Create account</button>
                <a th:href="@{/admin/accounts}" class="button secondary">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
