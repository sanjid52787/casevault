<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Organisation | CaseVault</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-mark">✓</span>CaseVault</a>
    <nav class="topnav">
        <a th:href="@{/admin/audit}">Audit</a>
        <a th:href="@{/admin/accounts}">Accounts</a>
        <a th:href="@{/admin/health}">Health</a>
        <a th:href="@{/password/change}">Password</a>
        <form class="logout-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Sign out</button>
        </form>
    </nav>
</header>

<main class="page">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Auditor / Account Administration</p>
            <h1>Create Organisation</h1>
            <p class="subtitle">Add a new tenant organisation. Users are always scoped to an organisation.</p>
        </div>
    </div>

    <section class="card">
        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}">Error</p>
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <p th:text="${successMessage}">Success</p>
        </div>

        <form th:action="@{/admin/organisations/create}" th:object="${request}" method="post" class="form-stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="name">Organisation name</label>
                <input id="name" type="text" th:field="*{name}" required minlength="2" maxlength="160"
                       placeholder="Acme Corp" class="form-input">
                <div th:if="${#fields.hasErrors('name')}" class="field-error">
                    <p th:each="err : ${#fields.errors('name')}" th:text="${err}">Validation error</p>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="button primary">Create organisation</button>
                <a th:href="@{/admin/accounts}" class="button secondary">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
