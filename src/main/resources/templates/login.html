<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Sign in | CaseVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1>CaseVault sign in</h1><p th:if="${param.error}">Invalid credentials</p><p th:if="${param.logout}">You have signed out.</p><form th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Email <input name="username" type="email" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></main></body></html>
