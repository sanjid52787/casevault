<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | CaseVault</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><main class="auth-card"><p class="eyebrow">Northbridge Cyber Response</p><h1>CaseVault</h1><p class="subtitle">Sign in to the secure case workspace.</p><p class="notice error" th:if="${param.error}">Invalid credentials</p><p class="notice success" th:if="${param.logout}">You have signed out.</p><form th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="redirect" th:value="${redirect}"><label>Email<input name="username" type="email" autocomplete="username" placeholder="you@example.test" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in securely</button></form><p class="footer-note">Synthetic training data only.</p></main></body></html>
