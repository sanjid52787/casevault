[project]
name = "casevault"
version = "1.0.0"
description = "Secure Forensic Case Management and Evidence Sharing Platform"
authors = [{ name = "Northbridge Cyber Response" }]
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "scripts",
    "__pycache__",
    "static",
    "staticfiles",
    "vault_storage",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (Django models)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "migrations",
    "tests",
]
