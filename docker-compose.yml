# ==============================================================================
# CaseVault Isolated Container Orchestration (docker-compose.yml)
# Organization: Northbridge Cyber Response
# Module: CYS22301 Software and Platform Security (Level 6)
# Standard: ADR-0006 Standardized Technology Decisions
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: casevault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: casevault_db
      POSTGRES_USER: casevault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CaseVaultSecurePgPassword2026!}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - casevault-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casevault -d casevault_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casevault-app
    restart: unless-stopped
    environment:
      - CASEVAULT_ENV=production
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,app,nginx
      - CSRF_TRUSTED_ORIGINS=https://localhost,https://127.0.0.1,http://localhost
      - DATABASE_URL=postgresql://casevault:${POSTGRES_PASSWORD:-CaseVaultSecurePgPassword2026!}@db:5432/casevault_db
    env_file:
      - .env
    volumes:
      - evidence-data:/app/vault_storage
      - static-data:/app/staticfiles
    networks:
      - casevault-internal
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/auth/login/"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: casevault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static-data:/app/staticfiles:ro
    networks:
      - casevault-internal
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true

networks:
  casevault-internal:
    driver: bridge
    internal: false

volumes:
  postgres-data:
    driver: local
  evidence-data:
    driver: local
  static-data:
    driver: local
