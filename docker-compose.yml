# ==============================================================================
# CaseVault Isolated Container Orchestration (docker-compose.yml)
# Organization: Northbridge Cyber Response
# Module: CYS22301 Software and Platform Security (Level 6)
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casevault-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - CASEVAULT_ENV=development
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    env_file:
      - .env
    volumes:
      - evidence-data:/app/vault_storage
      - static-data:/app/staticfiles
    networks:
      - casevault-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/auth/login/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  casevault-internal:
    driver: bridge
    internal: false

volumes:
  evidence-data:
    driver: local
  static-data:
    driver: local
