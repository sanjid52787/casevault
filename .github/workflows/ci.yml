name: CaseVault DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege pipeline permissions
permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Typing (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting & Type Checking Tools
        run: |
          python -m pip install --upgrade pip>=26.2.2
          pip install ruff==0.17.3 mypy==2.4.1

      - name: Ruff Linter Verification
        run: ruff check .

      - name: Mypy Static Type Verification
        run: mypy core accounts cases vault audit

  security-sast-sca:
    name: SAST, SCA & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install SAST & SCA Tools
        run: |
          python -m pip install --upgrade pip>=26.2.2
          pip install bandit==1.9.4 pip-audit==2.10.1 cyclonedx-bom==7.6.0 semgrep

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@f9076f571c4c1a5d6f1bfd8e75ff5f2b2b1bc279 # v2.3.9
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Static Application Security Testing (Bandit)
        run: bandit -r casevault_core core accounts cases vault audit -v

      - name: Static Application Security Testing (Semgrep)
        run: semgrep scan --config=.semgrep.yml core accounts cases vault audit --error

      - name: Software Composition Analysis (pip-audit)
        run: pip-audit -r requirements.lock

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment -o bom.json

  hadolint-dockerfile-lint:
    name: Dockerfile Linting (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9daab64cbac33534df4a837706571e74e5e0c # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  unit-and-security-tests:
    name: Automated Unit & Authorization Tests
    runs-on: ubuntu-latest
    needs: [code-quality, security-sast-sca]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Pinned Dependencies with Hashes
        run: |
          python -m pip install --upgrade pip>=26.2.2
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-django pytest-cov

      - name: Run Pytest Suite with Coverage Enforcement
        env:
          CASEVAULT_ENV: testing
          DEBUG: 'True'
          DJANGO_SECRET_KEY: 'ci-secret-key-for-automated-github-actions-testing-only-64chars'
          CASEVAULT_EVIDENCE_KEY: 'dGVzdC1rZXktZm9yLWNpLWZlcm5ldC1lbmNyeXB0aW9uMTI='
          CASEVAULT_AUDIT_HMAC_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          pytest --cov=core --cov=accounts --cov=cases --cov=vault --cov=audit --cov-fail-under=80

  docker-build-and-scan:
    name: Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: unit-and-security-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Rootless Container Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: casevault:ci-latest
          load: true

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: casevault:ci-latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  dast-zap-scan:
    name: OWASP ZAP Baseline DAST
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Self-Signed TLS Certificate for Test
        run: |
          python -m pip install cryptography
          python scripts/generate_self_signed_cert.py

      - name: Launch Docker Stack for DAST Scan
        run: |
          docker compose up -d --build
          sleep 10
          docker compose ps

      - name: Execute OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@c603a1d9a26ad3953dd6531ccaaef3f37b120f26 # v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://localhost:8443'
          cmd_options: '-m 3 -d -z "-config connection.timeoutInSecs=30 -config ssl.ignoreBadCertificates=true"'
          fail_action: false
