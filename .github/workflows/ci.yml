name: CaseVault DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-assurance:
    name: SAST & Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tooling
        run: |
          python -m pip install --upgrade pip>=26.2.2
          pip install bandit pip-audit

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r casevault_core core accounts cases vault audit -v

      - name: Software Composition Analysis (pip-audit)
        run: |
          pip-audit -r requirements.lock

  test-and-coverage:
    name: Automated Unit & Authorization Tests
    runs-on: ubuntu-latest
    needs: security-assurance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip>=26.2.2
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-django pytest-cov

      - name: Run Test Suite with Coverage
        env:
          CASEVAULT_ENV: testing
          DEBUG: 'True'
          DJANGO_SECRET_KEY: 'ci-secret-key-for-automated-github-actions-testing-only-64chars'
          CASEVAULT_EVIDENCE_KEY: 'dGVzdC1rZXktZm9yLWNpLWZlcm5ldC1lbmNyeXB0aW9uMTI='
          CASEVAULT_AUDIT_HMAC_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          pytest --cov=core --cov=accounts --cov=cases --cov=vault --cov=audit --cov-fail-under=80

  docker-build:
    name: Multi-Stage Rootless Docker Build
    runs-on: ubuntu-latest
    needs: test-and-coverage
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: casevault:latest
