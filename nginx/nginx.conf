# ==============================================================================
# CaseVault Nginx TLS Reverse Proxy Configuration
# Organization: Northbridge Cyber Response
# Module: CYS22301 Software and Platform Security (Level 6)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format secure_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log secure_log;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Security: Request Size Limits (Hard limit for uploads: 25 MB)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Hide Nginx version
    server_tokens off;

    # Upstream Gunicorn Application Server
    upstream casevault_backend {
        server app:8000;
    }

    # Redirect all plain HTTP to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost 127.0.0.1;

        return 301 https://$host$request_uri;
    }

    # Secure HTTPS Server
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name localhost 127.0.0.1;

        # TLS Configuration (TLS 1.2 and TLS 1.3 only)
        ssl_certificate /etc/nginx/certs/casevault.crt;
        ssl_certificate_key /etc/nginx/certs/casevault.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Transport & Defense-in-Depth Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Static files serving
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Reverse proxy to Gunicorn WSGI container
        location / {
            proxy_pass http://casevault_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_redirect off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }
    }
}
