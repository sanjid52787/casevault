# Gitleaks Configuration for CaseVault
# Enforces zero-secret policy across repository commits per Security Requirements

title = "CaseVault Gitleaks Rules"

[extend]
# Inherit standard Gitleaks rules if available

[[rules]]
id = "generic-api-key"
description = "Generic API Key or Secret Token"
regex = '''(?i)(?:key|api_key|apikey|secret|token|password|passwd|auth)\s*[:=]\s*['\"][0-9a-zA-Z\-_]{16,}['\"]'''
entropy = 3.5
secretGroup = 1

[[rules]]
id = "django-secret-key"
description = "Hardcoded Django Secret Key in source code"
regex = '''(?i)SECRET_KEY\s*=\s*['\"][^'\"]{20,}['\"]'''
entropy = 3.0

[[rules]]
id = "fernet-key"
description = "Hardcoded Fernet Symmetric Encryption Key"
regex = '''(?i)[A-Za-z0-9+/=]{44}'''
entropy = 4.0

[rules.allowlist]
description = "Allow inert synthetic fixtures in tests and example env files"
paths = [
    '''.env.example$''',
    '''tests/.*''',
    '''docs/.*''',
    '''\.github/workflows/.*''',
    '''requirements.lock$'''
]
regexes = [
    '''dGVzdC1rZXktZm9yLWNpLWZlcm5ldC1lbmNyeXB0aW9uMTI=''',
    '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
    '''ci-secret-key-for-automated-github-actions-testing-only-64chars'''
]
