limit_req_zone $binary_remote_addr zone=casevault_per_ip:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/dev-cert.pem;
    ssl_certificate_key /etc/nginx/tls/dev-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 11m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_req zone=casevault_per_ip burst=20 nodelay;

    error_page 413 /error-413.html;
    error_page 404 /error-404.html;
    error_page 500 502 503 504 /error-50x.html;

    location = /error-413.html {
        root /etc/nginx/error_pages;
        internal;
    }

    location = /error-404.html {
        root /etc/nginx/error_pages;
        internal;
    }

    location = /error-50x.html {
        root /etc/nginx/error_pages;
        internal;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /actuator/health {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
