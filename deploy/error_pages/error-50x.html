<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Temporarily Unavailable | CaseVault</title>
    <style>
        :root {
            --ink: #0f172a;
            --ink-soft: #334155;
            --muted: #64748b;
            --canvas: #f1f5f9;
            --surface: #fff;
            --line: #dbe4f0;
            --line-strong: #cbd5e1;
            --navy: #0b1533;
            --navy-2: #15295c;
            --brand: #2563eb;
            --brand-strong: #1d4ed8;
            --danger: #b42318;
            --danger-soft: #fef2f2;
            --radius: 16px;
            --shadow: 0 18px 45px rgba(15,23,42,.10);
        }
        * { box-sizing: border-box; }
        html { background: var(--canvas); }
        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: radial-gradient(900px 380px at 88% -130px, rgba(96,165,250,.28), transparent 65%),
                        radial-gradient(650px 350px at -8% 8%, rgba(45,212,191,.12), transparent 68%),
                        var(--canvas);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 15px;
            line-height: 1.55;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            position: sticky;
            z-index: 10;
            top: 0;
            min-height: 72px;
            padding: 0 max(5vw, 28px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            color: #fff;
            background: linear-gradient(105deg, var(--navy), var(--navy-2));
            border-bottom: 1px solid rgba(255,255,255,.09);
            box-shadow: 0 5px 18px rgba(15,23,42,.15);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            color: #fff;
            font-size: 1.12rem;
            font-weight: 800;
            letter-spacing: -.025em;
            text-decoration: none;
        }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 31px;
            height: 31px;
            border: 1px solid rgba(186,230,253,.8);
            border-radius: 9px;
            color: #dff5ff;
            background: rgba(125,211,252,.13);
            box-shadow: inset 0 1px rgba(255,255,255,.18);
        }
        .container {
            width: min(640px, calc(100% - 48px));
            margin: 60px auto 70px;
            flex: 1;
        }
        .card {
            padding: 36px;
            border: 1px solid rgba(203,213,225,.86);
            border-radius: var(--radius);
            background: rgba(255,255,255,.95);
            box-shadow: var(--shadow);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: 99px;
            color: #b45309;
            background: #fffbeb;
            border: 1px solid #fde68a;
            font-size: .74rem;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .badge::before { content: "•"; font-size: 1.1rem; line-height: 0; }
        .card h1 {
            margin: 0 0 12px;
            font-size: clamp(1.75rem, 3.5vw, 2.3rem);
            font-weight: 780;
            letter-spacing: -.04em;
            color: var(--ink);
        }
        .subtitle {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: .98rem;
            line-height: 1.6;
        }
        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }
        .button {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: 9px;
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand-strong));
            box-shadow: 0 5px 12px rgba(37,99,235,.2);
            font: 750 .88rem inherit;
            text-decoration: none;
            transition: .15s;
        }
        .button:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }
        .footer {
            margin-top: 24px;
            color: var(--muted);
            font-size: .8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">✓</span>CaseVault
        </a>
    </header>
    <main class="container">
        <article class="card">
            <div class="badge">Service Unavailable</div>
            <h1>Gateway Interruption</h1>
            <p class="subtitle">
                The CaseVault application gateway is temporarily unable to fulfill the request. This may occur during scheduled container updates or high-load conditions.
            </p>
            <div class="actions">
                <a href="/" class="button">Reload Application</a>
            </div>
        </article>
        <p class="footer">Northbridge Cyber Response &bull; CaseVault Secure Operations</p>
    </main>
</body>
</html>
