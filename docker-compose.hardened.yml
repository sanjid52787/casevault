services:
  app:
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
  proxy:
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/var/cache/nginx:rw,noexec,nosuid,size=32m", "/var/run:rw,noexec,nosuid,size=8m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
  db:
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/var/run/postgresql:rw,nosuid,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
  db-grants:
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.25
  storage-init:
    # This short-lived setup container alone needs CHOWN to prepare named volumes.
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 30
    mem_limit: 64m
    cpus: 0.1
